<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>JavaScript Mini Projects</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      margin: 0;
      padding: 50px;
      text-align: center;
      color: white;

      /* Purple gradient background */
      background: linear-gradient(135deg, #4f46e5, #7c3aed, #4338ca);
      background-size: 400% 400%;
      animation: bgMove 10s ease infinite;
    }

    @keyframes bgMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    h1 {
      font-size: 42px;
      margin-bottom: 8px;
    }

    p {
      opacity: 0.9;
      margin-bottom: 40px;
    }

    /* Project container */
    .projects {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
    }

    /* Project card */
    .card {
      background: rgba(15, 23, 42, 0.9);
      width: 260px;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      transition: transform 0.25s ease;
    }

    .card:hover {
      transform: translateY(-8px);
    }

    .card h2 {
      margin-bottom: 12px;
    }

    .card p {
      font-size: 14px;
      opacity: 0.85;
      margin-bottom: 22px;
    }

    /* Buttons */
    .btn {
      display: inline-block;
      padding: 12px 22px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
      transition: background 0.2s ease;
    }

    .btn:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>
  <h1>🚀 JavaScript Mini Projects</h1>
  <p>Built by Aayush</p>

  <div class="projects">

    <!-- Counter App -->
    <div class="card">
      <h2>🔢 Counter App</h2>
      <p>Increment, decrement, reset with dark mode & keyboard support.</p>
      <a href="./counter/" class="btn">Open App</a>
    </div>

    <!-- Mini Ludo Game -->
    <div class="card">
      <h2>🎲 Mini Ludo Game</h2>
      <p>Dice roll animation, token movement & exact-win rules.</p>
      <a href="./mini-ludo/" class="btn">Play Game</a>
    </div>

  </div>
</body>
</html>
